name: C64DM H-scroll empty-map optimization

on:
  push:
    paths:
      - '.github/workflows/c64dm-hscroll-empty-map-opt.yml'

permissions:
  contents: write

jobs:
  patch-hscroll:
    if: contains(github.event.head_commit.message, '[hscroll-opt-bootstrap]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch H-scroll defaults and empty-map expansion
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          draw_path = Path('C64DevMachine_win.yyp/scripts/scr_node_draw_macro_scroll/scr_node_draw_macro_scroll.gml')
          step_path = Path('C64DevMachine_win.yyp/scripts/scr_node_step_macro_scroll/scr_node_step_macro_scroll.gml')
          comp_path = Path('C64DevMachine_win.yyp/scripts/scr_compile_chain/scr_compile_chain.gml')

          draw = draw_path.read_text(encoding='utf-8')
          draw = replace_once(
              draw,
              'var _mm_base_addr = (array_length(instructions[0]) > 9 && is_real(instructions[0][9])) ? real(instructions[0][9]) : 0xA000;',
              'var _mm_base_addr = (array_length(instructions[0]) > 9 && is_real(instructions[0][9])) ? real(instructions[0][9]) : 0x4000;',
              'draw BASE ADDR default')
          draw_path.write_text(draw, encoding='utf-8')

          step = step_path.read_text(encoding='utf-8')
          step = replace_once(step,
              'if (array_length(instructions[0]) < 10) { array_push(instructions[0], 0xA000); }',
              'if (array_length(instructions[0]) < 10) { array_push(instructions[0], 0x4000); }',
              'step slot padding BASE ADDR')
          step = replace_once(step,
              'var _mm_cur_addr = is_real(instructions[0][9]) ? real(instructions[0][9]) : 0xA000;',
              'var _mm_cur_addr = is_real(instructions[0][9]) ? real(instructions[0][9]) : 0x4000;',
              'step BASE ADDR editor default')
          step_path.write_text(step, encoding='utf-8')

          comp = comp_path.read_text(encoding='utf-8')
          comp = replace_once(comp,
              'var _mm_base_addr = 0xA000;',
              'var _mm_base_addr = 0x4000;',
              'compiler BASE ADDR default')
          comp = replace_once(comp,
              'is invalid — falling back to $A000. Set BASE ADDR on the node to a free region clear of your code and other assets.',
              'is invalid — falling back to $4000. Set BASE ADDR on the node to a free region clear of your code and other assets.',
              'compiler BASE ADDR fallback message')
          comp = replace_once(comp,
              '_mm_base_addr = 0xA000;\n    }\n    var _mm_use_lut',
              '_mm_base_addr = 0x4000;\n    }\n    var _mm_use_lut',
              'compiler BASE ADDR fallback value')

          anchor = '''            var _mm_map_bases  = [];
            var _mm_map_widths = [];
            var _mm_run_addr   = _mm_base_addr;

            for (var _mm_mi = 0; _mm_mi < _mm_tm.map_count; _mm_mi++) {'''
          replacement = '''            var _mm_map_bases  = [];
            var _mm_map_widths = [];
            var _mm_run_addr   = _mm_base_addr;

            // Empty META maps do not need independent expanded char planes.
            // Pre-scan them and reserve ONE shared zero-filled plane large enough
            // for the biggest empty map. Every empty map can point at that same
            // plane while retaining its own width in the map-switch width table.
            var _mm_blank_base  = -1;
            var _mm_blank_size  = 0;
            var _mm_blank_count = 0;
            for (var _mm_bm = 0; _mm_bm < _mm_tm.map_count; _mm_bm++) {
                var _mm_bg = _mm_tm.maps[_mm_bm];
                var _mm_empty = true;
                for (var _mm_be = 0; _mm_be < array_length(_mm_bg); _mm_be++) {
                    if (_mm_bg[_mm_be] >= 0) { _mm_empty = false; break; }
                }
                if (!_mm_empty) continue;

                var _mm_bw = 40;
                if (_mm_bm < array_length(_mm_tm.map_w)) _mm_bw = _mm_tm.map_w[_mm_bm];
                var _mm_bc = max(1, floor(_mm_bw / _mm_sw));
                var _mm_br = floor(array_length(_mm_bg) / _mm_bc);
                var _mm_bh = _mm_br * _mm_sh;
                _mm_blank_size = max(_mm_blank_size, _mm_bw * _mm_bh);
                _mm_blank_count++;
            }

            for (var _mm_mi = 0; _mm_mi < _mm_tm.map_count; _mm_mi++) {'''
          comp = replace_once(comp, anchor, replacement, 'compiler empty-map pre-scan anchor')

          anchor2 = '''                var _mm_w_v = _mm_w_ch_v;
                var _mm_h_v = _mm_rows_v * _mm_sh;

                if (_mm_w_v > _mm_max_switch_w) {'''
          replacement2 = '''                var _mm_w_v = _mm_w_ch_v;
                var _mm_h_v = _mm_rows_v * _mm_sh;

                // Completely empty maps all share one expanded zero plane.
                // This preserves the existing base + row*width + column runtime
                // addressing and therefore adds no cost to the 6502 scroll path.
                var _mm_is_empty_v = true;
                for (var _mm_ev = 0; _mm_ev < array_length(_mm_grid_v); _mm_ev++) {
                    if (_mm_grid_v[_mm_ev] >= 0) { _mm_is_empty_v = false; break; }
                }
                if (_mm_is_empty_v) {
                    if (_mm_blank_base < 0) {
                        _mm_blank_base = _mm_run_addr;
                        array_push(_list, ["org", -2]);
                        array_push(_list, ["org", _mm_blank_base]);
                        var _mm_id_save_blank = _id;
                        var _id = noone;
                        for (var _mm_z = 0; _mm_z < _mm_blank_size; _mm_z++) {
                            array_push(_list, ["byte", 0]);
                        }
                        array_push(_list, ["org", -3]);
                        var _id = _mm_id_save_blank;
                        _mm_run_addr += _mm_blank_size;
                        show_debug_message("MACRO_SCROLL: shared " + string(_mm_blank_count)
                            + " empty map(s) in one " + string(_mm_blank_size) + " byte blank plane @ $"
                            + string_upper(decimal_to_hex(_mm_blank_base)));
                    }

                    array_push(_mm_map_bases,  _mm_blank_base);
                    array_push(_mm_map_widths, _mm_w_v);
                    if (_mm_w_v > _mm_max_switch_w) _mm_max_switch_w = _mm_w_v;

                    if (_mm_mi == _mm_map_index) {
                        _map_w    = _mm_w_v;
                        _map_h    = _mm_h_v;
                        _map_base = _mm_blank_base;
                    }
                    continue;
                }

                if (_mm_w_v > _mm_max_switch_w) {'''
          comp = replace_once(comp, anchor2, replacement2, 'compiler empty-map fast path anchor')
          comp_path.write_text(comp, encoding='utf-8')

          print('Patched H-scroll defaults and shared empty-map plane optimization.')

      - name: Commit optimized H-scroll
        run: |
          git config user.name "C64DM GitHub Action"
          git config user.email "actions@users.noreply.github.com"
          git add C64DevMachine_win.yyp/scripts/scr_node_draw_macro_scroll/scr_node_draw_macro_scroll.gml
          git add C64DevMachine_win.yyp/scripts/scr_node_step_macro_scroll/scr_node_step_macro_scroll.gml
          git add C64DevMachine_win.yyp/scripts/scr_compile_chain/scr_compile_chain.gml
          git commit -m "Optimize empty H-scroll MetaMaps and default to $4000"
          git push
