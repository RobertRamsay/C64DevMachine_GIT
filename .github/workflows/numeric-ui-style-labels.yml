name: Numeric UI style labels

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/numeric-ui-style-labels.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch visible UI style labels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('C64DevMachine_win.yyp/objects/obj_workspace_manager/Draw_64.gml')
          text = path.read_text(encoding='utf-8')

          text = text.replace('{ title: "CYBER PRESET",      action: "CYBER_PRESET"    },',
                              '{ title: "UI PRESET",         action: "CYBER_PRESET"    },')

          rules = [
              (r'_state_str\s*=\s*\(paletteStyle == sprite_get_number\(spr_palette_page\) - 1\) \? "CYBER" : string\(paletteStyle \+ 1\);',
               '_state_str = string(paletteStyle + 1);'),
              (r'_state_str\s*=\s*\(buttonStyle == _cy_btn_label\) \? "CYBER" : string\(buttonStyle \+ 1\);',
               '_state_str = string(buttonStyle + 1);'),
              (r'_state_str\s*=\s*macroStyle \? "CYBER" : "CLASSIC";',
               '_state_str = string(macroStyle + 1);'),
              (r'_state_str\s*=\s*\(badgeStyle == sprite_get_number\(spr_logobadge\) - 1\) \? "CYBER" : string\(badgeStyle \+ 1\);',
               '_state_str = string(badgeStyle + 1);'),
              (r'_state_str\s*=\s*\(bkgImg == sprite_get_number\(spr_bkg\) - 1\) \? "CYBER" : string\(bkgImg \+ 1\);',
               '_state_str = string(bkgImg + 1);'),
              (r'_state_str\s*=\s*uiChromeStyle \? "CYBER" : "CLASSIC";',
               '_state_str = string(uiChromeStyle + 1);'),
              (r'_state_str\s*=\s*\(niceSliceFrm == sprite_get_number\(spr_glassSlice\) - 1 && niceSliceFrm > 0\) \? "CYBER" : string\(niceSliceFrm \+ 1\);',
               '_state_str = string(niceSliceFrm + 1);'),
              (r'_state_str\s*=\s*\(nodeStyle >= sprite_get_number\(spr_9s_tile1\)\) \? "CYBER" : string\(nodeStyle \+ 1\);',
               '_state_str = string(nodeStyle + 1);'),
          ]
          for pattern, replacement in rules:
              text = re.sub(pattern, replacement, text, count=1)

          text = re.sub(
              r'\s*_state_str\s*=\s*_cy_all_state \? "ON" : "MIX";\n\s*_state_col\s*=\s*_cy_all_state \? c_yellow : make_color_rgb\(80, 180, 200\);',
              '\n            var _base_all_state = (paletteStyle == 0 && badgeStyle == 0 && buttonStyle == 0 &&\n                                   bkgImg == 0 && uiChromeStyle == 0 && niceSliceFrm == 0 &&\n                                   nodeStyle == 0 && macroStyle == 0);\n            _state_str = _cy_all_state ? "2" : (_base_all_state ? "1" : "MIX");\n            _state_col = _cy_all_state ? c_yellow : (_base_all_state ? c_gray : make_color_rgb(80, 180, 200));',
              text,
              count=1,
          )

          if '"CYBER"' in text or '"CLASSIC"' in text:
              raise SystemExit('Visible named style labels still remain')
          if '{ title: "CYBER PRESET"' in text:
              raise SystemExit('Visible CYBER PRESET title still remains')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/numeric-ui-style-labels.yml
          git config user.name "C64DevMachine UI patch"
          git config user.email "actions@users.noreply.github.com"
          git add C64DevMachine_win.yyp/objects/obj_workspace_manager/Draw_64.gml .github/workflows/numeric-ui-style-labels.yml
          git commit -m "Use numeric UI style labels"
          git push origin HEAD:main
