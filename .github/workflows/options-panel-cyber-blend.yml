name: Options panel and Cyber blend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/options-panel-cyber-blend.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Options behavior and Cyber blending
        shell: bash
        run: |
          git pull --rebase origin main
          python3 - <<'PY'
          from pathlib import Path
          p = Path('C64DevMachine_win.yyp/objects/obj_workspace_manager/Draw_64.gml')
          s = p.read_text(encoding='utf-8')
          old = '        if (_ihov && mouse_check_button_pressed(mb_left)) {\n            gui_menu_open = -1;\n            if (_op.action == "EXPERT_MODE") {'
          new = '        if (_ihov && mouse_check_button_pressed(mb_left)) {\n            if (_op.action == "EXPERT_MODE") {'
          if old not in s: raise SystemExit('Options click-close block not found')
          s = s.replace(old, new, 1)
          old = '    if (_bhover || _bopen) {\n        gpu_set_blendmode(bm_add);\n        draw_sprite_ext(spr_menu_button, (uiChromeStyle == 0) ? paletteStyle : sprite_get_number(spr_menu_button)-1,\n                        _bx, _by, 1, 1, 0, c_white, 0.2);\n        gpu_set_blendmode(bm_normal);\n    }'
          new = '    if (_bhover || _bopen) {\n        var _menu_overlay_additive = (uiChromeStyle == 0);\n        if (_menu_overlay_additive) gpu_set_blendmode(bm_add);\n        draw_sprite_ext(spr_menu_button, (uiChromeStyle == 0) ? paletteStyle : sprite_get_number(spr_menu_button)-1,\n                        _bx, _by, 1, 1, 0, c_white, 0.2);\n        if (_menu_overlay_additive) gpu_set_blendmode(bm_normal);\n    }'
          if old not in s: raise SystemExit('Menu overlay blend block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/options-panel-cyber-blend.yml
          git config user.name "C64DevMachine UI patch"
          git config user.email "actions@users.noreply.github.com"
          git add C64DevMachine_win.yyp/objects/obj_workspace_manager/Draw_64.gml .github/workflows/options-panel-cyber-blend.yml
          git commit -m "Keep Options open and soften Cyber overlay"
          git push origin HEAD:main
