name: Refine UI preset and Cyber opcode layering

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/refine-ui-preset-opcode-panel.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch UI preset, panel chrome, and Cyber opcode layering
        shell: bash
        run: |
          git pull --rebase origin main
          python3 - <<'PY'
          from pathlib import Path

          path = Path('C64DevMachine_win.yyp/objects/obj_workspace_manager/Draw_64.gml')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(label + ' not found')
              text = text.replace(old, new, 1)

          replace_once('var _menu_labels = [\n    "MACROS", "EXTRA", "VARS", "PROJECT", "OPTIONS", "DOCUMENTS", "IMPORT", "TBA"\n];', 'var _menu_labels = [\n    "MACROS", "EXTRA", "VARS", "PROJECT", "OPTIONS", "DOCUMENTS", "IMPORT", "TBA"\n];\n\n// Menu-bar chrome is owned by Panel Style; keep old saved settings in sync too.\nuiChromeStyle = (niceSliceFrm > 0) ? 1 : 0;', 'menu chrome sync anchor')

          replace_once('        { title: "MACRO BUTTONS",      action: "MACRO_STYLE"      },\n', '', 'macro style option')
          replace_once('        { title: "MENU CHROME",        action: "MENU_CHROME"      },\n', '', 'menu chrome option')

          old_state = '\n'.join([
              '            var _cy_all_state = (paletteStyle == sprite_get_number(spr_palette_page) - 1 &&',
              '                                 badgeStyle == sprite_get_number(spr_logobadge) - 1 &&',
              '                                 buttonStyle == _cy_btn_state &&',
              '                                 bkgImg == sprite_get_number(spr_bkg) - 1 &&',
              '                                 uiChromeStyle == 1 &&',
              '                                 niceSliceFrm == sprite_get_number(spr_glassSlice) - 1 &&',
              '                                 nodeStyle == _cy_node_state && macroStyle == 1);',
              '            var _base_all_state = (paletteStyle == 0 && badgeStyle == 0 && buttonStyle == 0 &&',
              '                                   bkgImg == 0 && uiChromeStyle == 0 && niceSliceFrm == 0 &&',
              '                                   nodeStyle == 0 && macroStyle == 0);',
              '            _state_str = _cy_all_state ? "2" : (_base_all_state ? "1" : "MIX");',
              '            _state_col = _cy_all_state ? c_yellow : (_base_all_state ? c_gray : make_color_rgb(80, 180, 200));'
          ])
          new_state = '\n'.join([
              '            var _cy_all_state = (paletteStyle == sprite_get_number(spr_palette_page) - 1 &&',
              '                                 badgeStyle == sprite_get_number(spr_logobadge) - 1 &&',
              '                                 buttonStyle == _cy_btn_state &&',
              '                                 bkgImg == sprite_get_number(spr_bkg) - 1 &&',
              '                                 uiChromeStyle == 1 &&',
              '                                 niceSliceFrm == sprite_get_number(spr_glassSlice) - 1 &&',
              '                                 nodeStyle == _cy_node_state);',
              '            _state_str = _cy_all_state ? "2" : "1";',
              '            _state_col = _cy_all_state ? c_yellow : c_gray;'
          ])
          replace_once(old_state, new_state, 'preset state')

          replace_once('        if (_op.action == "MACRO_STYLE") {\n            _state_str = string(macroStyle + 1);\n            _state_col = macroStyle ? c_yellow : c_gray;\n        }\n', '', 'macro style state')
          replace_once('        if (_op.action == "MENU_CHROME") {\n            _state_str = string(uiChromeStyle + 1);\n            _state_col = uiChromeStyle ? c_yellow : c_gray;\n        }\n', '', 'menu chrome state')

          old_action = '\n'.join([
              '                var _cy_all_action = (paletteStyle == sprite_get_number(spr_palette_page) - 1 &&',
              '                                      badgeStyle == sprite_get_number(spr_logobadge) - 1 &&',
              '                                      buttonStyle == _cy_btn_action &&',
              '                                      bkgImg == sprite_get_number(spr_bkg) - 1 &&',
              '                                      uiChromeStyle == 1 &&',
              '                                      niceSliceFrm == sprite_get_number(spr_glassSlice) - 1 &&',
              '                                      nodeStyle == _cy_node_action && macroStyle == 1);',
              '                if (_cy_all_action) {',
              '                    paletteStyle = 0; badgeStyle = 0; buttonStyle = 0; bkgImg = 0;',
              '                    uiChromeStyle = 0; niceSliceFrm = 0; nodeStyle = 0; macroStyle = 0;',
              '                } else {',
              '                    paletteStyle = max(0, sprite_get_number(spr_palette_page) - 1);',
              '                    badgeStyle = max(0, sprite_get_number(spr_logobadge) - 1);',
              '                    buttonStyle = _cy_btn_action;',
              '                    bkgImg = max(0, sprite_get_number(spr_bkg) - 1);',
              '                    uiChromeStyle = 1;',
              '                    niceSliceFrm = max(0, sprite_get_number(spr_glassSlice) - 1);',
              '                    nodeStyle = _cy_node_action;',
              '                    macroStyle = 1;',
              '                }'
          ])
          new_action = '\n'.join([
              '                var _cy_all_action = (paletteStyle == sprite_get_number(spr_palette_page) - 1 &&',
              '                                      badgeStyle == sprite_get_number(spr_logobadge) - 1 &&',
              '                                      buttonStyle == _cy_btn_action &&',
              '                                      bkgImg == sprite_get_number(spr_bkg) - 1 &&',
              '                                      uiChromeStyle == 1 &&',
              '                                      niceSliceFrm == sprite_get_number(spr_glassSlice) - 1 &&',
              '                                      nodeStyle == _cy_node_action);',
              '                if (_cy_all_action) {',
              '                    paletteStyle = 0; badgeStyle = 0; buttonStyle = 0; bkgImg = 0;',
              '                    uiChromeStyle = 0; niceSliceFrm = 0; nodeStyle = 0;',
              '                } else {',
              '                    paletteStyle = max(0, sprite_get_number(spr_palette_page) - 1);',
              '                    badgeStyle = max(0, sprite_get_number(spr_logobadge) - 1);',
              '                    buttonStyle = _cy_btn_action;',
              '                    bkgImg = max(0, sprite_get_number(spr_bkg) - 1);',
              '                    uiChromeStyle = 1;',
              '                    niceSliceFrm = max(0, sprite_get_number(spr_glassSlice) - 1);',
              '                    nodeStyle = _cy_node_action;',
              '                }'
          ])
          replace_once(old_action, new_action, 'preset action')

          replace_once('            else if (_op.action == "MACRO_STYLE") {\n                macroStyle = (macroStyle + 1) mod 2;\n            }\n', '', 'macro style action')
          replace_once('            else if (_op.action == "MENU_CHROME") {\n                uiChromeStyle = (uiChromeStyle + 1) mod 2;\n            }\n', '', 'menu chrome action')
          replace_once('            else if (_op.action == "PANEL_STYLE") {\n                niceSliceFrm = (niceSliceFrm + 1) mod max(1, sprite_get_number(spr_glassSlice));\n            }', '            else if (_op.action == "PANEL_STYLE") {\n                niceSliceFrm = (niceSliceFrm + 1) mod max(1, sprite_get_number(spr_glassSlice));\n                uiChromeStyle = (niceSliceFrm > 0) ? 1 : 0;\n            }', 'panel style action')

          old_button = '\n'.join([
              '    // Button background sprite',
              '    if (is_hover) {',
              '        draw_sprite_ext(spr_opcode_button, buttonStyle+1, btn_x, btn_y, 1, 1, 0, c_white, 1);',
              '    } else {',
              '        draw_sprite_ext(spr_opcode_button, buttonStyle, btn_x, btn_y, 1, 1, 0, c_white, 1);',
              '    }'
          ])
          new_button = '\n'.join([
              '    // Button background sprite. Cyber keeps the base and layers its highlight frame over it.',
              '    var _cyber_btn_style = max(0, sprite_get_number(spr_opcode_button) - 2);',
              '    var _is_cyber_button = (buttonStyle == _cyber_btn_style);',
              '    if (_is_cyber_button) {',
              '        draw_sprite_ext(spr_opcode_button, buttonStyle, btn_x, btn_y, 1, 1, 0, c_white, 1);',
              '        if (is_hover || _is_finder_match) {',
              '            // Highlight frame is an ordinary alpha overlay, never additive.',
              '            draw_sprite_ext(spr_opcode_button, buttonStyle+1, btn_x, btn_y, 1, 1, 0, c_white, 1);',
              '        }',
              '    } else if (is_hover) {',
              '        draw_sprite_ext(spr_opcode_button, buttonStyle+1, btn_x, btn_y, 1, 1, 0, c_white, 1);',
              '    } else {',
              '        draw_sprite_ext(spr_opcode_button, buttonStyle, btn_x, btn_y, 1, 1, 0, c_white, 1);',
              '    }'
          ])
          replace_once(old_button, new_button, 'opcode button draw')

          replace_once('        var _cyber_btn_style = max(0, sprite_get_number(spr_opcode_button) - 2);\n        if (buttonStyle == _cyber_btn_style) {', '        if (_is_cyber_button) {', 'cyber hover condition')
          replace_once('        var _cyber_btn_style_pulse = max(0, sprite_get_number(spr_opcode_button) - 2);\n        if (buttonStyle == _cyber_btn_style_pulse) {', '        if (_is_cyber_button) {', 'cyber finder condition')
          replace_once('        if (buttonStyle != _cyber_btn_style_pulse) gpu_set_blendmode(bm_normal);', '        if (!_is_cyber_button) gpu_set_blendmode(bm_normal);', 'cyber finder blend reset')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/refine-ui-preset-opcode-panel.yml
          git config user.name "C64DevMachine UI patch"
          git config user.email "actions@users.noreply.github.com"
          git add C64DevMachine_win.yyp/objects/obj_workspace_manager/Draw_64.gml .github/workflows/refine-ui-preset-opcode-panel.yml
          git commit -m "Simplify UI preset and layer Cyber opcode highlight"
          git push origin HEAD:main
