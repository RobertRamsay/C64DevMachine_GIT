name: C64DM repair cyber UI metadata

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/c64dm-cyber-ui.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          root=Path('C64DevMachine_win.yyp/sprites')
          for spr in ['spr_menu_button','spr_menu_bar','spr_glassSlice']:
              p=root/spr/f'{spr}.yy'
              t=p.read_text(encoding='utf-8')
              # Remove the temporary inline marker; GameMaker YY stays clean.
              t=t.replace(', // C64DM_CYBER_FRAME', ',')
              # Count actual frame-definition entries only.
              frames=re.findall(r'\{\"\$GMSpriteFrame\":\"v1\",\"%Name\":\"([0-9a-f-]+)\"',t)
              if not frames: raise RuntimeError(f'No frames found for {spr}')
              cyber=frames[-1]
              count=len(frames)
              t=re.sub(r'\"length\":[0-9.]+', f'\"length\":{count}.0', t, count=1)
              # Fix only the keyframe that references the appended final frame.
              pat=(r'(\"Id\":\{\"name\":\"'+re.escape(cyber)+r'\".*?\"Key\":)[0-9.]+')
              t,n=re.subn(pat, r'\g<1>'+str(count-1)+'.0', t, count=1, flags=re.S)
              if n != 1: raise RuntimeError(f'Could not repair cyber key for {spr}')
              p.write_text(t,encoding='utf-8')
              print(spr, 'frames=',count,'cyber key=',count-1)
          PY
          git config user.name "C64DM UI Bot"
          git config user.email "actions@github.com"
          git add C64DevMachine_win.yyp/sprites/spr_menu_button/spr_menu_button.yy C64DevMachine_win.yyp/sprites/spr_menu_bar/spr_menu_bar.yy C64DevMachine_win.yyp/sprites/spr_glassSlice/spr_glassSlice.yy
          git commit -m "Fix Cyber UI sprite sequence metadata"
          git push
