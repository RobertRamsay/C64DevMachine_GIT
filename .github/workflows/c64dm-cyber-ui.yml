name: C64DM append cyber UI chrome

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/c64dm-cyber-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  append-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append Cyber UI subimages and wire style 9
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import re, uuid

          root = Path('C64DevMachine_win.yyp')
          create = root/'objects/obj_workspace_manager/Create_0.gml'
          step = root/'objects/obj_workspace_manager/Step_0.gml'
          draw = root/'objects/obj_workspace_manager/Draw_64.gml'

          c = create.read_text(encoding='utf-8')
          if 'uiChromeStyle' in c:
              print('Cyber UI chrome already wired; nothing to do.')
              raise SystemExit(0)

          def cyber_button(w,h):
              im=Image.new('RGBA',(w,h),(0,0,0,0)); d=ImageDraw.Draw(im)
              cut=max(5,min(12,h//4)); poly=[(2,2),(w-cut-1,2),(w-2,cut+1),(w-2,h-3),(cut+1,h-3),(2,h-cut-2)]
              d.polygon(poly, fill=(10,13,15,238), outline=(246,211,37,255))
              d.line([(cut+3,5),(w-cut-9,5)], fill=(255,224,48,220), width=2)
              d.line([(8,h-7),(w//3,h-7)], fill=(229,35,67,245), width=2)
              d.line([(w//3+5,h-7),(w//2,h-7)], fill=(38,204,220,230), width=1)
              d.line([(6,9),(6,h-12)], fill=(105,83,14,220), width=1)
              d.rectangle((w-18,7,w-9,9), fill=(229,35,67,230))
              return im

          def cyber_bar(w,h):
              im=Image.new('RGBA',(w,h),(0,0,0,0)); d=ImageDraw.Draw(im)
              d.rectangle((0,0,w-1,h-1), fill=(7,10,12,245))
              d.line((0,1,w-1,1), fill=(246,211,37,235), width=2)
              d.line((0,h-2,w-1,h-2), fill=(81,61,12,230), width=1)
              seg=max(80,w//10)
              for x in range(18,w,seg):
                  d.line((x,5,min(x+35,w-1),5), fill=(229,35,67,235), width=2)
                  d.line((min(x+42,w-1),5,min(x+62,w-1),5), fill=(38,204,220,220), width=1)
              d.polygon([(w-52,0),(w-1,0),(w-1,13),(w-39,13)], fill=(34,28,8,220))
              return im

          def cyber_panel(w,h):
              im=Image.new('RGBA',(w,h),(0,0,0,0)); d=ImageDraw.Draw(im)
              d.rectangle((0,0,w-1,h-1), fill=(6,9,11,242))
              d.rectangle((1,1,w-2,h-2), outline=(91,70,14,230))
              d.line((2,2,w-20,2), fill=(246,211,37,255), width=2)
              d.line((2,18,w-1,18), fill=(70,54,13,220), width=1)
              d.line((2,h-19,w-1,h-19), fill=(70,54,13,220), width=1)
              d.line((2,h-3,w//2,h-3), fill=(229,35,67,245), width=2)
              d.line((w//2+6,h-3,w-3,h-3), fill=(38,204,220,220), width=1)
              d.polygon([(w-20,0),(w-1,0),(w-1,15),(w-9,15)], fill=(32,25,7,255))
              d.rectangle((8,7,22,9), fill=(229,35,67,230))
              d.rectangle((25,7,31,8), fill=(38,204,220,230))
              return im

          specs=[('spr_menu_button',cyber_button),('spr_menu_bar',cyber_bar),('spr_glassSlice',cyber_panel)]
          for spr,painter in specs:
              yy=root/f'sprites/{spr}/{spr}.yy'; txt=yy.read_text(encoding='utf-8')
              width=int(re.search(r'"width":(\d+)',txt).group(1)); height=int(re.search(r'"height":(\d+)',txt).group(1))
              layer=re.search(r'"layers":\[\s*\{.*?"name":"([0-9a-f-]+)"',txt,re.S).group(1)
              frame=str(uuid.uuid4()); kid=str(uuid.uuid4()); n=len(re.findall(r'\$GMSpriteFrame',txt))
              frame_line=f'    {{"$GMSpriteFrame":"v1","%Name":"{frame}","name":"{frame}","resourceType":"GMSpriteFrame","resourceVersion":"2.0",}}, // C64DM_CYBER_FRAME\n'
              txt=txt.replace('  ],\n  "gridX":0,',frame_line+'  ],\n  "gridX":0,',1)
              txt=re.sub(r'"length":([0-9.]+)',f'"length":{n+1}.0',txt,count=1)
              anchor='          ],"resourceType":"KeyframeStore<SpriteFrameKeyframe>"'
              kf=(f'            {{"$Keyframe<SpriteFrameKeyframe>":"","Channels":{{\n                "0":{{"$SpriteFrameKeyframe":"","Id":{{"name":"{frame}","path":"sprites/{spr}/{spr}.yy",}},"resourceType":"SpriteFrameKeyframe","resourceVersion":"2.0",}},\n              }},"Disabled":false,"id":"{kid}","IsCreationKey":false,"Key":{n}.0,"Length":1.0,"resourceType":"Keyframe<SpriteFrameKeyframe>","resourceVersion":"2.0","Stretch":false,}},\n')
              txt=txt.replace(anchor,kf+anchor,1)
              yy.write_text(txt,encoding='utf-8')
              im=painter(width,height)
              out=root/f'sprites/{spr}/{frame}.png'; out.parent.mkdir(parents=True,exist_ok=True); im.save(out)
              lay=root/f'sprites/{spr}/layers/{frame}/{layer}.png'; lay.parent.mkdir(parents=True,exist_ok=True); im.save(lay)

          c=c.replace('niceSliceFrm = 1;','niceSliceFrm = 0;\nuiChromeStyle = 0; // 0 existing chrome, 1 appended Cyber chrome')
          create.write_text(c,encoding='utf-8')
          s=step.read_text(encoding='utf-8')
          s=s.replace('if keyboard_check_pressed(ord("9")) niceSliceFrm ++;','if keyboard_check_pressed(ord("9")) { uiChromeStyle = (uiChromeStyle + 1) mod 2; niceSliceFrm = (uiChromeStyle == 0) ? 0 : sprite_get_number(spr_glassSlice)-1; }',1)
          s=s.replace('if keyboard_check_pressed(ord("0")) {niceSliceFrm=0;bkgImg=0;paletteStyle=0;buttonStyle=0}','if keyboard_check_pressed(ord("0")) {uiChromeStyle=0;niceSliceFrm=0;bkgImg=0;paletteStyle=0;buttonStyle=0}',1)
          step.write_text(s,encoding='utf-8')
          d=draw.read_text(encoding='utf-8')
          d=d.replace('draw_sprite(spr_menu_bar, paletteStyle, _sw_plus ,0)','draw_sprite(spr_menu_bar, (uiChromeStyle == 0) ? paletteStyle : sprite_get_number(spr_menu_bar)-1, _sw_plus ,0)',1)
          d=d.replace('draw_sprite_ext(spr_menu_button, paletteStyle,','draw_sprite_ext(spr_menu_button, (uiChromeStyle == 0) ? paletteStyle : sprite_get_number(spr_menu_button)-1,')
          d=d.replace('draw_sprite_stretched(spr_glassSlice, 0,','draw_sprite_stretched(spr_glassSlice, niceSliceFrm,')
          draw.write_text(d,encoding='utf-8')
          PY
          git config user.name "C64DM UI Bot"
          git config user.email "actions@github.com"
          git add C64DevMachine_win.yyp/sprites/spr_menu_button C64DevMachine_win.yyp/sprites/spr_menu_bar C64DevMachine_win.yyp/sprites/spr_glassSlice C64DevMachine_win.yyp/objects/obj_workspace_manager/Create_0.gml C64DevMachine_win.yyp/objects/obj_workspace_manager/Step_0.gml C64DevMachine_win.yyp/objects/obj_workspace_manager/Draw_64.gml
          git commit -m "Append Cyber UI chrome subimages"
          git push
