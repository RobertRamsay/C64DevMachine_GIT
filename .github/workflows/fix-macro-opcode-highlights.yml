name: Clean macro list and Cyber opcode glow

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-macro-opcode-highlights.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch macro list and opcode glow
        shell: bash
        run: |
          git pull --rebase origin main
          python3 - <<'PY'
          from pathlib import Path

          path = Path('C64DevMachine_win.yyp/objects/obj_workspace_manager/Draw_64.gml')
          text = path.read_text(encoding='utf-8')

          old_macro = '''        // Macro row skin: use the appended Cyber normal/hover pair when selected.\n        if (macroStyle == 1 && _mp.type != \"HEADER\") {\n            var _macro_cy_base = max(0, sprite_get_number(spr_macroButton) - 2);\n            var _macro_cy_frame = _ihov ? min(_macro_cy_base + 1, sprite_get_number(spr_macroButton) - 1) : _macro_cy_base;\n            draw_sprite_stretched(spr_macroButton, _macro_cy_frame, _ix1 + 4, _iy, _panel_w - 8, _item_h);\n        }\n        else if (_ihov) {'''
          new_macro = '''        // Keep macro menu rows clean: no button sprite behind menu entries.\n        if (_ihov) {'''
          if old_macro not in text:
              raise SystemExit('Macro row skin block not found')
          text = text.replace(old_macro, new_macro, 1)

          old_hover = '''    // Additive hover glow (hover or finder highlight)\n    if (is_hover || _is_finder_match) {\n        gpu_set_blendmode(bm_add);\n        draw_sprite(spr_hover_glow, 0, btn_x + btn_w * 0.5, btn_y + btn_h * 0.5);\n        gpu_set_blendmode(bm_normal);\n    }'''
          new_hover = '''    // Opcode hover/finder highlight. Cyber uses a restrained normal-blend glow.\n    if (is_hover || _is_finder_match) {\n        var _cyber_btn_style = max(0, sprite_get_number(spr_opcode_button) - 2);\n        if (buttonStyle == _cyber_btn_style) {\n            draw_set_alpha(0.32);\n            draw_sprite(spr_hover_glow, 0, btn_x + btn_w * 0.5, btn_y + btn_h * 0.5);\n            draw_set_alpha(1.0);\n        } else {\n            gpu_set_blendmode(bm_add);\n            draw_sprite(spr_hover_glow, 0, btn_x + btn_w * 0.5, btn_y + btn_h * 0.5);\n            gpu_set_blendmode(bm_normal);\n        }\n    }'''
          if old_hover not in text:
              raise SystemExit('Opcode hover glow block not found')
          text = text.replace(old_hover, new_hover, 1)

          old_pulse = '''    // Finder pulse glow\n    if (_is_finder_match && !is_hover) {\n        var _pulse_scale = 1.0 + 0.2 * sin(degtorad(current_time * 0.4));\n        var _pulse_alpha = 0.5 + 0.4 * sin(degtorad(current_time * 0.4));\n        gpu_set_blendmode(bm_add);\n        draw_set_alpha(_pulse_alpha);\n        draw_sprite_ext(spr_hover_glow, 0,\n            btn_x + btn_w * 0.5, btn_y + btn_h * 0.5,\n            _pulse_scale, _pulse_scale,\n            0, c_aqua, 1.0);\n        draw_set_alpha(1.0);\n        gpu_set_blendmode(bm_normal);\n    }'''
          new_pulse = '''    // Finder pulse glow. Cyber stays normal-blend and deliberately subtle.\n    if (_is_finder_match && !is_hover) {\n        var _pulse_scale = 1.0 + 0.2 * sin(degtorad(current_time * 0.4));\n        var _pulse_alpha = 0.5 + 0.4 * sin(degtorad(current_time * 0.4));\n        var _cyber_btn_style_pulse = max(0, sprite_get_number(spr_opcode_button) - 2);\n        if (buttonStyle == _cyber_btn_style_pulse) {\n            draw_set_alpha(_pulse_alpha * 0.28);\n        } else {\n            gpu_set_blendmode(bm_add);\n            draw_set_alpha(_pulse_alpha);\n        }\n        draw_sprite_ext(spr_hover_glow, 0,\n            btn_x + btn_w * 0.5, btn_y + btn_h * 0.5,\n            _pulse_scale, _pulse_scale,\n            0, c_aqua, 1.0);\n        draw_set_alpha(1.0);\n        if (buttonStyle != _cyber_btn_style_pulse) gpu_set_blendmode(bm_normal);\n    }'''
          if old_pulse not in text:
              raise SystemExit('Finder pulse block not found')
          text = text.replace(old_pulse, new_pulse, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-macro-opcode-highlights.yml
          git config user.name "C64DevMachine UI patch"
          git config user.email "actions@users.noreply.github.com"
          git add C64DevMachine_win.yyp/objects/obj_workspace_manager/Draw_64.gml .github/workflows/fix-macro-opcode-highlights.yml
          git commit -m "Clean macro menu and soften Cyber opcode glow"
          git push origin HEAD:main
